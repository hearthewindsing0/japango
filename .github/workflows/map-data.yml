# Downloads OpenStreetMap data for the game area and rebuilds the tile map,
# then commits the result to the same branch. Runs when the area or the map
# scripts change, or by hand from the Actions tab.
name: Map data

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/area.mjs
      - scripts/fetch-osm.mjs
      - scripts/build-map.mjs
      - scripts/fetch-mapillary.mjs
      - scripts/fetch-plateau.mjs
      - scripts/fetch-terrain.mjs
      - scripts/fetch-bridges.mjs
      - scripts/fetch-wiki.mjs
      - scripts/fetch-aerial.mjs
      - scripts/build-dict.mjs
      - .github/workflows/map-data.yml

permissions:
  contents: write

concurrency:
  group: map-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-latest
    env:
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch OpenStreetMap data
        run: node scripts/fetch-osm.mjs
      - name: Fetch PLATEAU 3D building data
        run: node scripts/fetch-plateau.mjs
      - name: Fetch PLATEAU terrain
        run: node scripts/fetch-terrain.mjs
      - name: Fetch PLATEAU bridges
        run: node scripts/fetch-bridges.mjs
      - name: Fetch Wikipedia places
        run: node scripts/fetch-wiki.mjs
      - name: Install script dependencies
        run: npm ci
      - name: Roof colors from GSI aerial photos
        run: node scripts/fetch-aerial.mjs
      - name: Fetch Mapillary street-level data
        # Skipped until the MAPILLARY_TOKEN repository secret is set.
        if: ${{ env.MAPILLARY_TOKEN != '' }}
        run: node scripts/fetch-mapillary.mjs
      - name: Build map
        run: node scripts/build-map.mjs
      - name: Japanese dictionary for the map's text (JMdict)
        run: |
          url=$(curl -fsSL https://api.github.com/repos/scriptin/jmdict-simplified/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jmdict-eng-[0-9].*\\.json\\.tgz$")) | .browser_download_url' | head -1)
          echo "JMdict: $url"
          mkdir -p /tmp/jmdict && curl -fsSL "$url" | tar xz -C /tmp/jmdict
          node --max-old-space-size=6144 scripts/build-dict.mjs /tmp/jmdict/*.json
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/maps public/dict
          if git diff --cached --quiet; then
            echo "Map data unchanged."
          else
            git commit -m "Update map data from OpenStreetMap, PLATEAU and Mapillary"
            git push
          fi
