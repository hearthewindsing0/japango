# Builds the game map for each area in areas/: downloads every data source
# for it at once (OpenStreetMap, PLATEAU buildings/terrain/bridges, GSI
# aerial roof colors, Mapillary, Wikipedia), builds the map, cuts it into
# tiles and the dictionary, and uploads all of it to the server (R2, see
# scripts/data.mjs); none of it goes into git. Only a new or changed
# areas/<id>.json is committed, to the same branch.
#
# It only runs when started by hand: Actions tab → Map data → "Run workflow".
# Give an area id plus a center and size, or a box of corners, to add or
# change an area (it writes areas/<id>.json). With just an id it rebuilds
# that area; "all" rebuilds every area. Players get the new map as soon as
# the upload finishes. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
name: Map data

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Area id, like shibuya (lowercase, dashes ok), or "all"'
        default: all
      name:
        description: 'New area: Japanese name, like 渋谷'
        required: false
      name_en:
        description: 'New area: English name, like Shibuya'
        required: false
      center:
        description: 'New area: center "lat,lon" (use with size)'
        required: false
      size:
        description: 'New area: size in meters "width x height", like 1500x1200'
        required: false
      corners:
        description: 'New area instead of center+size: "south,west,north,east"'
        required: false
      rotation:
        description: 'Degrees to turn the map (counter-clockwise), so a main street runs across. Default 0'
        required: false
      spawn:
        description: 'Where players start, "lat,lon" (default: the center)'
        required: false
      sounds:
        description: 'Also download the city sounds again (Freesound)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: map-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.list.outputs.areas }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          AREA_INPUT: ${{ github.event.inputs.area }}
        run: |
          want="${AREA_INPUT:-all}"
          if [ "$want" = all ]; then
            areas=$(ls areas/*.json | xargs -n1 basename | sed 's/\.json$//' | jq -R . | jq -sc .)
          else
            echo "$want" | grep -Eq '^[a-z0-9-]+$' || { echo "::error::Area id must be lowercase letters, digits and dashes"; exit 1; }
            areas=$(jq -nc --arg a "$want" '[$a]')
          fi
          echo "areas=$areas" >> "$GITHUB_OUTPUT"
          echo "Areas: $areas"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJson(needs.plan.outputs.areas) }}
    env:
      AREA: ${{ matrix.area }}
      MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Add or change the area
        if: ${{ github.event.inputs.center != '' || github.event.inputs.corners != '' || github.event.inputs.name != '' || github.event.inputs.rotation != '' || github.event.inputs.spawn != '' }}
        env:
          IN_NAME: ${{ github.event.inputs.name }}
          IN_NAME_EN: ${{ github.event.inputs.name_en }}
          IN_CENTER: ${{ github.event.inputs.center }}
          IN_SIZE: ${{ github.event.inputs.size }}
          IN_CORNERS: ${{ github.event.inputs.corners }}
          IN_ROTATION: ${{ github.event.inputs.rotation }}
          IN_SPAWN: ${{ github.event.inputs.spawn }}
        run: |
          args=(--id "$AREA")
          [ -n "$IN_NAME" ] && args+=(--name "$IN_NAME")
          [ -n "$IN_NAME_EN" ] && args+=(--name-en "$IN_NAME_EN")
          [ -n "$IN_CENTER" ] && args+=(--center "$IN_CENTER")
          [ -n "$IN_SIZE" ] && args+=(--size "$IN_SIZE")
          [ -n "$IN_CORNERS" ] && args+=(--corners "$IN_CORNERS")
          [ -n "$IN_ROTATION" ] && args+=(--rotation "$IN_ROTATION")
          [ -n "$IN_SPAWN" ] && args+=(--spawn "$IN_SPAWN")
          bun scripts/add-area.mjs "${args[@]}"
      - name: Check the area exists
        run: test -f "areas/$AREA.json" || { echo "::error::No areas/$AREA.json. Give a center and size (or corners) to add it."; exit 1; }
      - name: Last run's data from the server
        # A source that fails this time is built from its last snapshot, and
        # the dictionary also covers the conversations' words.
        run: bun scripts/data.mjs pull sources talk
      - name: Download every source at once, build the map and tiles
        run: bun scripts/fetch-all.mjs
      - name: Japanese dictionary for the map's text (JMdict, Tatoeba, KANJIDIC2, KanjiVG)
        run: bash scripts/build-dict.sh
      - name: Upload to the server
        run: bun scripts/data.mjs push sources tiles dict
      - name: Keep the area file for the commit job
        uses: actions/upload-artifact@v4
        with:
          name: area-${{ matrix.area }}
          retention-days: 3
          path: areas/${{ matrix.area }}.json

  sounds:
    # City sounds are shared by every area. Only when asked for, and once
    # the FREESOUND_TOKEN repository secret is set.
    runs-on: ubuntu-latest
    if: ${{ inputs.sounds }}
    env:
      FREESOUND_TOKEN: ${{ secrets.FREESOUND_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.FREESOUND_TOKEN != '' }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ env.FREESOUND_TOKEN != '' }}
        with:
          bun-version: 1.4.x
      - name: City sounds from Freesound
        if: ${{ env.FREESOUND_TOKEN != '' }}
        run: bun scripts/fetch-sounds.mjs
      - run: bun install --frozen-lockfile
        if: ${{ env.FREESOUND_TOKEN != '' }}
      - name: Upload to the server
        if: ${{ env.FREESOUND_TOKEN != '' }}
        run: bun scripts/data.mjs push sounds

  commit:
    # Commits new or changed area files (areas/<id>.json), the only part of
    # a run that lives in git. Areas that built are committed even if
    # another failed.
    needs: [build]
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Nothing to download if every area failed.
        continue-on-error: true
        with:
          path: /tmp/built
      - name: Commit area files
        run: |
          shopt -s nullglob
          for d in /tmp/built/area-*; do cp -r "$d"/. areas/; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A areas
          if git diff --cached --quiet; then
            echo "Area files unchanged."
          else
            git commit -m "Add or change map areas"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi
