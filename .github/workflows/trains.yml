# Builds the train timetables (public/trains/<area>.json) from the operators'
# static GTFS feeds and commits them. Timetables change a few times a year
# (ダイヤ改正), so this only runs by hand (Actions tab → Train timetables →
# "Run workflow") and when its own script changes on main.
#
# Toei's GTFS (Ōedo Line) is public. Tokyo Metro's (Hibiya Line) needs an
# ODPT developer key: once approved, add it as the ODPT_TOKEN repository
# secret and run this again. TODO(ODPT): with the key, also move the game to
# live train data (delays, positions); see README "Trains".
name: Train timetables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trains/**
      - .github/workflows/trains.yml

permissions:
  contents: write

concurrency:
  group: trains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Build the timetables
        env:
          ODPT_TOKEN: ${{ secrets.ODPT_TOKEN }}
        run: bun scripts/trains/build-timetables.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/trains
          if git diff --cached --quiet; then
            echo "Timetables unchanged."
          else
            git commit -m "Update train timetables"
            git pull --rebase
            git push
          fi
