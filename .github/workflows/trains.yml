# Builds the train timetables (public/trains/<area>.json) from the operators'
# static GTFS feeds and uploads them to the server (R2, the "trains" set of
# scripts/data.mjs; the Worker serves /trains/ from there). Timetables change a few times a year
# (ダイヤ改正), so this only runs by hand (Actions tab → Train timetables →
# "Run workflow") and when its own script changes on main.
#
# Toei's GTFS (Ōedo Line) is public. Tokyo Metro's (Hibiya Line) needs an
# ODPT developer key: the ODPT_TOKEN repository secret. Live delays come
# from the Worker (worker/trains-live.ts); see README "Trains".
name: Train timetables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trains/**
      - .github/workflows/trains.yml

permissions:
  contents: read

concurrency:
  group: trains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Build the timetables
        env:
          ODPT_TOKEN: ${{ secrets.ODPT_TOKEN }}
        run: bun scripts/trains/build-timetables.mjs
      - name: Upload to the server
        run: |
          bun install --frozen-lockfile
          bun scripts/data.mjs push trains
