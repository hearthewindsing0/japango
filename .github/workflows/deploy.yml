# Builds the game and deploys it as a Cloudflare Worker: the site and the
# API with its D1 database. Runs on every push to main. The game's generated
# data (map tiles, dictionary, conversations, ...) isn't part of this: the
# workflows that make it upload it to R2 themselves (scripts/data.mjs).
# Does nothing until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets are set.
name: Deploy

on:
  push:
    branches: [main]
  # The Map data workflow's own commits (new areas) don't start workflows,
  # so deploy after it finishes on main too.
  workflow_run:
    workflows: [Map data, Conversations]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Waiting for Cloudflare secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
      - uses: actions/checkout@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          bun-version: 1.4.x
      - name: Install
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: bun install --frozen-lockfile
      - name: Make sure the D1 database and R2 bucket exist
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: bun scripts/cf-setup.mjs
      - name: Move the data that used to be in git to R2 (once)
        # Until this change, generated data was committed. If R2 doesn't
        # have it yet, upload it from the last commit that still had it.
        # Sets already in R2 are left alone, so this is quick after the
        # first run.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          [ ! -e public/tiles/roppongi/manifest.json ] || { echo "Data is still in git."; exit 0; }
          # The commit (on main) that took it out; its first parent still had it.
          gone=$(git log -1 --first-parent --format=%H -- public/tiles/roppongi/manifest.json)
          [ -n "$gone" ] || { echo "Nothing to move."; exit 0; }
          git worktree add -q --detach "$RUNNER_TEMP/old" "$gone^"
          for f in "$RUNNER_TEMP"/old/areas/*.json; do
            AREA=$(basename "$f" .json) bun scripts/data.mjs seed --root "$RUNNER_TEMP/old"
          done
          git worktree remove --force "$RUNNER_TEMP/old"
      - name: Update the database
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: bunx wrangler d1 migrations apply japango --remote
      - name: Build and deploy the Worker
        # wrangler.toml's [build] command builds the site first.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: bunx wrangler deploy
