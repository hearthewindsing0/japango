# Writes the conversations people have at the talking spots (Claude),
# voices them with VOICEVOX (run here as a service container, nothing to
# sign up for), then rebuilds the dictionary so their words get furigana and
# word cards, and commits the result. Run it by hand from the Actions tab;
# it also runs when the conversation scripts change.
# Needs the ANTHROPIC_API_KEY repository secret.
name: Conversations

on:
  workflow_dispatch:
    inputs:
      redo:
        description: Write every conversation again (otherwise only new scenes)
        type: boolean
        default: false
  push:
    paths:
      - scripts/fetch-conversations.mjs
      - scripts/voice-conversations.mjs
      - scripts/voices.mjs
      - .github/workflows/conversations.yml

permissions:
  contents: write

concurrency:
  group: conversations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOICEVOX_URL: http://localhost:50021
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - name: Waiting for the Anthropic key
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "::notice::Set the ANTHROPIC_API_KEY repository secret to write conversations."
      - uses: actions/checkout@v4
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          bun-version: 1.4.x
      - name: Install
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          bun install --frozen-lockfile
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Write the conversations
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: bun scripts/fetch-conversations.mjs ${{ inputs.redo && '--redo' || '' }}
      - name: Voice them with VOICEVOX
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: bun scripts/voice-conversations.mjs
      - name: Dictionary for the new words
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: bash scripts/build-dict.sh
      - name: Commit
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/talk public/dict
          if git diff --cached --quiet; then
            echo "Conversations unchanged."
          else
            git commit -m "Update conversations at the talking spots"
            git pull --rebase
            git push
          fi
