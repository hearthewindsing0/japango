<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite code · japango</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg: #f6efe4; --card: #fffaf2; --ink: #2b2420; --muted: #7a6d63; --line: #d9cbb8; --accent: #d9534f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1a18; --card: #2a2522; --ink: #f2e9dd; --muted: #b3a597; --line: #4a413a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font: 17px/1.5 "M PLUS 1", system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 18px; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button.plain { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  #msg { min-height: 1.5em; margin: 14px 0 0; color: var(--ink); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Invite code</h1>
  <p>Live AI conversations run on the game's own account, so they need an invite code. Everything else in the game is open to all.</p>
  <form id="f">
    <input id="code" type="password" autocomplete="off" placeholder="Your code" aria-label="Invite code" required>
    <button>Unlock</button>
  </form>
  <div id="msg" role="status"></div>
  <p style="margin-top:18px"><a href="/">Back to the game</a></p>
</main>
<script>
  const msg = document.getElementById('msg'), form = document.getElementById('f')
  function show(s) {
    if (s.open) {
      msg.innerHTML = ''
      msg.append(`Unlocked for ${s.name}` + (s.left != null ? ` (${s.left} AI calls left today). ` : '. '))
      const out = document.createElement('button'); out.className = 'plain'; out.textContent = 'Lock'
      out.onclick = async () => { await fetch('/api/gate', { method: 'DELETE' }); form.hidden = false; msg.textContent = 'Locked.' }
      msg.append(out); form.hidden = true
    }
  }
  fetch('/api/gate').then((r) => r.json()).then(show).catch(() => {})
  form.onsubmit = async (e) => {
    e.preventDefault(); msg.textContent = 'Checking…'
    try {
      const r = await fetch('/api/gate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: document.getElementById('code').value }) })
      const s = await r.json()
      if (r.ok) { document.getElementById('code').value = ''; show(await (await fetch('/api/gate')).json()) } else msg.textContent = s.error || 'That didn’t work.'
    } catch { msg.textContent = 'Couldn’t reach the game’s server.' }
  }
</script>
</body>
</html>
