# Cloudflare Worker that hosts the game: the built site (dist/), map tiles
# and the rest of the generated data (scripts/data.mjs) from R2, and a small API backed by D1. Deployed by .github/workflows/deploy.yml.
name = "japango"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# Build the site before every deploy, so Cloudflare's own Git builds work
# too (they only run `wrangler deploy` / `wrangler versions upload`).
[build]
command = "bun run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*", "/tiles/*", "/dict/*", "/talk/*", "/life/*", "/trains/*", "/sounds/*", "/data/*", "/index/*",
]

[[r2_buckets]]
binding = "DATA"
bucket_name = "japango-tiles"

[[d1_databases]]
binding = "DB"
database_name = "japango"
# The live database. scripts/cf-setup.mjs creates it if it is missing and
# fills in its id for the deploy Action.
database_id = "f8849de2-e8c7-424c-9a42-b7ae822f5105"
migrations_dir = "migrations"
