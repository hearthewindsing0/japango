# Cloudflare Worker that hosts the game: the built site (dist/), map tiles
# from R2 and a small API backed by D1. Deployed by .github/workflows/deploy.yml.
name = "japango"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/tiles/*"]

[[r2_buckets]]
binding = "TILES"
bucket_name = "japango-tiles"

[[d1_databases]]
binding = "DB"
database_name = "japango"
# Filled in by scripts/cf-setup.mjs, which creates the database if needed.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
